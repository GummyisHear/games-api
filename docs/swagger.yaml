openapi: 3.0.2
info:
  title: Games API
  version: 1.0.0
  description: |
    ### This is a Swagger UI for our Games API

    ### Error handling
    Errors are presented using the HTTP status codes 400-599.
    The response includes a more detailed explanation of the error in the body.

    ```json
    {
      "error": "Cleartext explanation of the error that occurred"
    }
    ```

    ### Generic API errors
    These error responses can be returned by any of the described endpoints.

    | HTTP status | Description |
    |---|---|
    | 400 | Bad input parameters or invalid request. More information can be found in the response body. |
    | 401 | The consumer does not have access to the requested resource or the provided token is not valid. |
    | 403 | Access token is missing, expired, invalid, or requires higher privileges (Admin). |
    | 404 | The requested resource cannot be found or the user does not have access to the resource. |
    | 409 | Conflict, such as a duplicate name or username. |
    | 5XX | A server error has occurred while processing the request. |

paths:
  /register:
    post:
      tags:
        - auth
      summary: Register a new user
      description: Creates a new regular user account.
      requestBody:
        description: Credentials for the new user
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
            examples:
              New user:
                value:
                  username: johndoe
                  password: securepassword123
      responses:
        '201':
          description: User registered successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registered successfully
        '400':
          description: Username and password are required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                Missing params:
                  value:
                    error: Username and password are required
        '409':
          description: Username already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                Duplicate username:
                  value:
                    error: Username already taken

  /login:
    post:
      tags:
        - auth
      summary: Log in a user
      description: Authenticates user credentials and returns a JWT access token.
      requestBody:
        description: User credentials
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
            examples:
              Login credentials:
                value:
                  username: admin
                  password: admin123
      responses:
        '200':
          description: Login successful. Returns JWT token, role, and username.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  role:
                    type: string
                    example: admin
                  username:
                    type: string
                    example: admin
        '401':
          description: Invalid username or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                Invalid credentials:
                  value:
                    error: Invalid username or password

  /games:
    get:
      tags:
        - games
      summary: Get a list of all games
      description: Returns a list of all games in API (Public access)
      responses:
        '200':
          description: List of games returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
              examples:
                List of games:
                  value:
                    - id: 1
                      name: Witcher 3
                      price: 29.99
                    - id: 2
                      name: Cyberpunk 2077
                      price: 59.99
    post:
      tags:
        - new-game
      summary: Creates a game
      description: Creates a new game. Requires authentication (User or Admin).
      security:
        - BearerAuth: []
      requestBody:
        description: A new game to be created
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/new-game'
            examples:
              New game:
                value:
                  name: Tetris
                  price: 0.99
      responses:
        '201':
          description: Game was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
              examples:
                Created game:
                  value:
                    id: 9
                    name: Tetris
                    price: 0.99
        '400':
          description: One or all params are missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                Missing params:
                  value:
                    error: One or all params are missing
        '401':
          description: Access token required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                No token:
                  value:
                    error: Access token required
        '403':
          description: Invalid or expired token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                Invalid token:
                  value:
                    error: Invalid or expired token
        '409':
          description: A game with this name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                Duplicate name:
                  value:
                    error: A game with this name already exists

  /games/{id}:
    get:
      tags:
        - games ID
      summary: Get a game by ID
      description: Returns the details of a specific game identified by its ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the game to retrieve.
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Game details returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
              examples:
                Full details of a given game:
                  value:
                    id: 1
                    name: Witcher 3
                    price: 29.99
        '404':
          description: Game was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                Game was not found:
                  value:
                    error: Game not found
    put:
      tags:
        - update-game
      summary: Updates a game
      description: Updates the name and price of the game. Requires Admin privileges.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the game to update.
          schema:
            type: integer
          example: 1
      requestBody:
        description: The new details of the game
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update-game'
            examples:
              Updated game:
                value:
                  name: Witcher 3 GOTY
                  price: 39.99
      responses:
        '200':
          description: Game was updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
              examples:
                Updated game:
                  value:
                    id: 1
                    name: Witcher 3 GOTY
                    price: 39.99
        '400':
          description: One or all params are missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                Missing params:
                  value:
                    error: One or all params are missing
        '401':
          description: Access token required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Admin privileges required or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                Not admin:
                  value:
                    error: Admin privileges required
        '404':
          description: Game with the given ID was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                Game was not found:
                  value:
                    error: Game not found
        '409':
          description: A game with this name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                Duplicate name:
                  value:
                    error: A game with this name already exists
    delete:
      tags:
        - delete-game
      summary: Deletes a game
      description: Deletes the game identified by its ID. Requires Admin privileges.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the game to delete.
          schema:
            type: integer
          example: 2
      responses:
        '204':
          description: Game was deleted successfully. No content is returned.
        '401':
          description: Access token required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Admin privileges required or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                Not admin:
                  value:
                    error: Admin privileges required
        '404':
          description: Game with the given ID was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                Game was not found:
                  value:
                    error: Game not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Game:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Witcher 3
        price:
          type: number
          format: float
          example: 29.99
      required:
        - id
        - name
        - price

    new-game:
      type: object
      properties:
        name:
          type: string
          example: Tetris
        price:
          type: number
          format: float
          example: 0.99
      required:
        - name
        - price
      example:
        name: Tetris
        price: 0.99

    update-game:
      type: object
      properties:
        name:
          type: string
          example: Witcher 3 GOTY
        price:
          type: number
          format: float
          example: 39.99
      required:
        - name
        - price
      example:
        name: Witcher 3 GOTY
        price: 39.99

    AuthCredentials:
      type: object
      properties:
        username:
          type: string
          example: myuser
        password:
          type: string
          example: mypassword123
      required:
        - username
        - password
      example:
        username: myuser
        password: mypassword123

    error:
      type: object
      properties:
        error:
          type: string
          example: Error message.
      required:
        - error
      example:
        error: Error message.