<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Games API</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
<div id="app" class="container mt-5" style="max-width: 700px">
    <div class="border rounded-4 overflow-hidden">
        <table id="gamesTable" class="table table-striped mb-0">
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th></th>
            </tr>
            <tr v-for="game in games">
                <td style="cursor: pointer" @click="getGame(game.id)">{{ game.name }}</td>
                <td>{{ game.price }}</td>
                <td class="text-end">
                    <button class="btn btn-secondary btn-sm me-1" @click="openEditModal(game)">Edit</button>
                    <button class="btn btn-danger btn-sm" @click="openDeleteModal(game)">Delete</button>
                </td>
            </tr>
        </table>
    </div>

    <button class="btn btn-primary mt-3" @click="openAddModal()">Add +</button>

    <div id="gameInfoModal" class="modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Game Information</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-striped">
                        <tr>
                            <th>ID</th>
                            <td>{{ gameInModal.id }}</td>
                        </tr>
                        <tr>
                            <th>Name</th>
                            <td>{{ gameInModal.name }}</td>
                        </tr>
                        <tr>
                            <th>Price</th>
                            <td>{{ gameInModal.price }}</td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <div id="gameFormModal" class="modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">{{ gameInForm.id ? 'Edit game' : 'Add game' }}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" v-model="gameInForm.name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Price</label>
                        <input type="number" step="0.01" min="0" class="form-control" v-model.number="gameInForm.price">
                    </div>
                    <div v-if="formError" class="alert alert-danger mb-0">{{ formError }}</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" @click="saveGame()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <div id="gameDeleteModal" class="modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Delete game</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete <strong>{{ gameToDelete.name }}</strong>?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" @click="deleteGame()">Delete</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
<script src="https://unpkg.com/vue@3.2.26/dist/vue.global.js"></script>
<script src="rest-client.js"></script>
</body>
</html>
